services:
  mc-inventario:
    build:
      context: ./services/mc-inventario
      dockerfile: Dockerfile

    container_name: mc-inventario

    env_file:
      - ./services/mc-inventario/.env

    ports:
      - "8000:8000"

    volumes:
      - ./services/mc-inventario:/app

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:17-alpine

    container_name: postgres-inventario

    env_file:
      - ./services/mc-inventario/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis-inventario

    ports:
      - "6379:6379"

  celery:
    build:
      context: ./services/mc-inventario
      dockerfile: Dockerfile

    container_name: celery-inventario

    env_file:
      - ./services/mc-inventario/.env

    volumes:
      - ./services/mc-inventario:/app

    command: celery -A config worker --loglevel=info

    depends_on:
      - redis
      - postgres
      - mc-inventario

  celery-beat:
    build:
      context: ./services/mc-inventario
      dockerfile: Dockerfile

    container_name: celery-beat-inventario

    env_file:
      - ./services/mc-inventario/.env

    volumes:
      - ./services/mc-inventario:/app

    command: celery -A config beat --loglevel=info

    depends_on:
      - redis
      - postgres
      - celery

volumes:
  postgres_data: