services:
  mc-inventario:
    build:
      context: ./services/mc-inventario
      dockerfile: Dockerfile

    container_name: mc-inventario

    env_file:
      - ./services/mc-inventario/.env

    ports:
      - "8000:8000"

    volumes:
      - ./services/mc-inventario:/app

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - redis
      - postgres

  postgres:
    image: postgres:17-alpine

    container_name: postgres-inventario

    env_file:
      - ./services/mc-inventario/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mc-ventas:
    build:
      context: ./services/mc-ventas
      dockerfile: Dockerfile

    container_name: mc-ventas

    env_file:
      - ./services/mc-ventas/.env

    ports:
      - "8001:8000"

    volumes:
      - ./services/mc-ventas:/app

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - postgres-ventas

  postgres-ventas:
    image: postgres:17-alpine

    container_name: postgres-ventas

    env_file:
      - ./services/mc-ventas/.env

    ports:
      - "5433:5432"

    volumes:
      - postgres_ventas_data:/var/lib/postgresql/data

  mc-usuarios:
    build:
      context: ./services/mc-usuarios
      dockerfile: Dockerfile

    container_name: mc-usuarios

    env_file:
      - ./services/mc-usuarios/.env

    ports:
      - "8002:8000"

    volumes:
      - ./services/mc-usuarios:/app

    command: python manage.py runserver 0.0.0.0:8000

    depends_on:
      - postgres-usuarios

  postgres-usuarios:
    image: postgres:17-alpine

    container_name: postgres-usuarios

    env_file:
      - ./services/mc-usuarios/.env

    ports:
      - "5434:5432"

    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis-inventario

    ports:
      - "6379:6379"

  celery:
    build:
      context: ./services/mc-inventario
      dockerfile: Dockerfile

    container_name: celery-inventario

    env_file:
      - ./services/mc-inventario/.env

    volumes:
      - ./services/mc-inventario:/app

    command: celery -A config worker --loglevel=info

    depends_on:
      - redis
      - postgres
      - mc-inventario

  celery-beat:
    build:
      context: ./services/mc-inventario
      dockerfile: Dockerfile

    container_name: celery-beat-inventario

    env_file:
      - ./services/mc-inventario/.env

    volumes:
      - ./services/mc-inventario:/app

    command: celery -A config beat --loglevel=info

    depends_on:
      - redis
      - postgres
      - celery

volumes:
  postgres_data:
  postgres_ventas_data:
  postgres_usuarios_data: